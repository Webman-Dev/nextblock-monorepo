name: ✨ Feature request
description: Suggest a capability or improvement for NextBlock.
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The most useful requests describe a **problem you hit**,
        not just a solution — that leaves room for a better answer than either of us
        thought of first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What were you doing, and where did NextBlock get in the way?
      placeholder: I need to reorder blocks across two columns, but drag-and-drop only works inside one column, so I have to delete and recreate them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of NextBlock?
      options:
        - Block system / page builder
        - Editor (Tiptap)
        - Custom blocks
        - Live draft mode
        - Database, auth, or migrations
        - Commerce
        - Cortex AI
        - CLI / scaffolding (create-nextblock)
        - Deployment (Vercel, Docker, self-hosting)
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you tried, or other tools that solve this well.

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to work on this?
      description: Entirely optional — but see CONTRIBUTING.md if you are interested.
      options:
        - label: I would be willing to open a pull request for this.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions, and this is not a duplicate.
          required: true
