name: Sync to Public Mirror

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Swap Ghost Modules
        run: |
          # Remove the real private library
          rm -rf libs/ecommerce

          # Copy the stub version
          cp -r tools/stubs/libs/ecommerce libs/ecommerce

          echo "Ghost Module Swap Completed: libs/ecommerce replaced with stubs."

      - name: Clean Private Configurations
        run: |
          # Remove private environment files
          rm -f .env .env.local .env.*.local

          # Remove any other sensitive files if needed
          # rm -f config/private-key.pem

      - name: Debug Secret
        run: |
          echo "Checking secret existence..."
          if [ -z "${{ secrets.API_TOKEN_GITHUB }}" ]; then
            echo "❌ ERROR: The secret API_TOKEN_GITHUB is EMPTY!"
          else
            echo "✅ Secret found. Length: ${#SECRET}"
            echo "First 4 chars: ${SECRET:0:4}..."
          fi
        env:
          SECRET: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Push to Public Mirror (Manual)
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
          TARGET_REPO: 'nextblock-cms/nextblock'
          TARGET_BRANCH: 'master'
        run: |
          echo "⚙️ Configuring Git..."
          git config --global user.name "NextBlock"
          git config --global user.email "dev@nextblock.ca"

          # 1. Create a temporary folder for the target repo
          echo "📥 Cloning public mirror..."
          # CRITICAL: We construct the URL manually with the token
          git clone https://x-access-token:${API_TOKEN_GITHUB}@github.com/${TARGET_REPO}.git ../public_mirror

          # 2. Copy the filtered files from current dir to the public mirror dir
          # We use rsync to copy everything EXCEPT the .git folder itself
          echo "📋 Syncing files..."
          rsync -av --delete --exclude='.git' --exclude='.github' --exclude='node_modules' ./ ../public_mirror/

          # 3. Commit and Push
          echo "🚀 Pushing updates..."
          cd ../public_mirror
          git add .

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "✅ No changes to sync."
          else
            git commit -m "Sync from Private: ${GITHUB_SHA}"
            git push origin ${TARGET_BRANCH}
            echo "✅ Push successful!"
          fi
