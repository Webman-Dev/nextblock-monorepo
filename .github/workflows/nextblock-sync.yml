# NextBlock upstream sync — Track A (Git-backed forks: Vercel 1-click, GitHub forks).
#
# Once a day (and on demand) this merges the latest upstream NextBlock release branch
# into this repository's deploy branch:
#   * Clean merge  -> commit + push to the deploy branch, which triggers Vercel CD, and
#                     auto-close any open conflict issue.
#   * Conflict     -> abort the merge and open (or update) a GitHub Issue labeled
#                     `nextblock-sync-conflict`. The CMS dashboard polls the GitHub API
#                     and mirrors that issue into a banner — see lib/updates/check-upstream.ts.
#
# Zero secrets required: the conflict signal uses the automatically-provided GITHUB_TOKEN.
# The app writes the dashboard alert itself using the Supabase key it already has, so no
# Supabase credentials need to be added to GitHub. (Private repos: the app needs a
# GITHUB_TOKEN env var to read its own issues — see docs. Public repos need nothing.)
#
# NOTE: GitHub disables Actions on a freshly-forked repo until the owner enables them once
# (repo -> Actions tab -> "I understand my workflows, go ahead and enable them").

name: NextBlock Upstream Sync

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to merge from'
        required: false
        default: 'master'

# contents: write -> push the merge commit. issues: write -> open/close the conflict issue.
permissions:
  contents: write
  issues: write

concurrency:
  group: nextblock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REMOTE: https://github.com/nextblock-cms/nextblock.git
      UPSTREAM_LABEL: nextblock-cms/nextblock
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
      TARGET_BRANCH: ${{ github.ref_name }}
      CONFLICT_LABEL: nextblock-sync-conflict
      CONFLICT_TITLE: 'Upstream sync needs manual resolution'
      CONFLICT_MARKER: '<!-- nextblock-sync-conflict -->'
    steps:
      - name: Checkout deploy branch (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure the committing identity
        # Author the merge as the GitHub user running the workflow, using their canonical
        # GitHub noreply email. Vercel blocks deploys whose commit-author email isn't tied
        # to a real GitHub account, so a synthetic bot email (e.g. nextblock-sync[bot]@…)
        # is rejected — the actor's github.com noreply is accepted.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "${UPSTREAM_REMOTE}" 2>/dev/null || git remote set-url upstream "${UPSTREAM_REMOTE}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream into the deploy branch
        id: merge
        shell: bash
        run: |
          # --allow-unrelated-histories: a Vercel 1-click deploy creates a fresh repo (not a
          # fork), so it shares no history with upstream and a plain merge is refused. The
          # first merge bridges them (creating a common ancestor); later merges are normal.
          set +e
          MERGE_OUTPUT=$(git merge --no-commit --no-ff --allow-unrelated-histories "upstream/${UPSTREAM_BRANCH}" 2>&1)
          MERGE_CODE=$?
          set -e
          echo "$MERGE_OUTPUT"

          if git ls-files --unmerged | grep -q .; then
            echo "Merge produced conflicts; aborting so they can be resolved on GitHub."
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          elif echo "$MERGE_OUTPUT" | grep -qiE "already up to date|already up-to-date"; then
            echo "status=current" >> "$GITHUB_OUTPUT"
          elif [ "$MERGE_CODE" -ne 0 ]; then
            echo "Merge failed for a non-conflict reason; treating as needs-attention."
            git merge --abort 2>/dev/null || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          else
            echo "status=merged" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the merge (triggers Vercel CD)
        if: steps.merge.outputs.status == 'merged'
        run: |
          git commit --no-edit -m "chore(sync): merge upstream ${UPSTREAM_LABEL}@${UPSTREAM_BRANCH}" \
            -m "Automated upstream sync via the NextBlock Upstream Sync workflow."
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Pushed merged upstream changes to ${TARGET_BRANCH}."

      - name: Clear any open conflict issue (sync is healthy again)
        if: steps.merge.outputs.status == 'merged' || steps.merge.outputs.status == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for n in $(gh issue list --limit 50 --search "is:open in:title $CONFLICT_TITLE" --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "Resolved automatically — upstream now merges cleanly into ${TARGET_BRANCH}." || true
            echo "Closed conflict issue #$n."
          done

      - name: Open a conflict issue (the dashboard mirrors it into a banner)
        # Fires on a detected conflict, or as a catch-all if any earlier step failed
        # unexpectedly (e.g. the push was rejected) — so an operator is always notified.
        if: ${{ steps.merge.outputs.status == 'conflict' || failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The dashboard finds this issue by the hidden marker in the body — NOT by label —
          # so a label that fails to create can never block issue creation.
          BODY=$(printf '%s\n' \
            "The automated sync from ${UPSTREAM_LABEL} (${UPSTREAM_BRANCH}) could not be merged into ${TARGET_BRANCH} automatically." \
            "" \
            "To resolve:" \
            "1. Merge upstream locally: git fetch ${UPSTREAM_REMOTE} ${UPSTREAM_BRANCH} && git merge --allow-unrelated-histories FETCH_HEAD" \
            "2. Fix the conflicts, commit, and push to ${TARGET_BRANCH} (this triggers a new deploy)." \
            "3. Close this issue — the CMS dashboard banner clears automatically." \
            "" \
            "Workflow run: ${RUN_URL}" \
            "" \
            "$CONFLICT_MARKER")

          EXISTING=$(gh issue list --limit 50 --search "is:open in:title $CONFLICT_TITLE" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still conflicting as of ${NOW}. Run: ${RUN_URL}" || true
            echo "Updated existing conflict issue #${EXISTING}."
          else
            # Create WITHOUT --label so a missing label can't fail this; add the label after,
            # best-effort, purely as a human-friendly nicety.
            CREATED=$(gh issue create --title "$CONFLICT_TITLE" --body "$BODY" 2>/dev/null || true)
            echo "Opened conflict issue: ${CREATED}"
            NUM=$(printf '%s\n' "$CREATED" | grep -oE '[0-9]+$' || true)
            if [ -n "$NUM" ]; then
              gh label create "$CONFLICT_LABEL" --color B60205 --description "Automated upstream sync conflict" >/dev/null 2>&1 || true
              gh issue edit "$NUM" --add-label "$CONFLICT_LABEL" >/dev/null 2>&1 || true
            fi
          fi
